<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Gestão de Estoque Inteligente</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #F2E8E8; margin: 0; padding: 20px; color: #333; }
    h1 { text-align: center; color: #E7357F; }

    .container { max-width: 1200px; margin: auto; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

    .search-container {
      margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
      padding: 12px; border-radius: 10px; border: 2px solid #EED316; background: #fff;
    }
    .search-container input { flex: 1; border: none; font-size: 16px; outline: none; }

    form { 
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; 
      margin-bottom: 25px; padding: 20px; background: #fff; border-radius: 10px; 
      border: 2px solid #eee; transition: 0.3s;
    }
    form.editando { border-color: #E7357F; background: #fff9fb; }

    input, button, select { padding: 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
    
    #btnSubmit { background: #E7357F; color: #fff; border: none; cursor: pointer; font-weight: bold; }
    #btnCancelar { background: #636e72; color: #fff; border: none; cursor: pointer; display: none; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { background: #EED316; color: #333; padding: 15px; font-size: 12px; text-transform: uppercase; }
    td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; font-size: 14px; }

    .stock-baixo { background-color: #fff9db !important; }
    .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
    .status-ok { background: #dcfce7; color: #166534; }
    .status-esgotado { background: #fee2e2; color: #991b1b; }
    .alerta-texto { display: block; color: #b45309; font-size: 10px; font-weight: bold; margin-top: 4px; }

    .img-produto { width: 45px; height: 45px; object-fit: cover; border-radius: 50%; border: 2px solid #F2E8E8; }
    .btn-edit { background: #EED316; color: #333; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; }
    .btn-remove { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; }
    
    .total-container { margin-top: 20px; padding: 15px; background: #EED316; border-radius: 8px; text-align: right; font-weight: bold; font-size: 1.4em; }
    
    .relatorios { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 25px; }
    .btn-rel { padding: 10px 20px; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-rel:hover { opacity: 0.8; }
    .btn-pdf { background-color: #E7357F; }
    .btn-excel { background-color: #27ae60; }
    .btn-txt { background-color: #2d3436; }
  </style>
</head>
<body>

<h1>📦 Gestão de Estoque Inteligente</h1>

<div class="container">
  
  <div class="search-container">
    <span>🔍</span>
    <input type="text" id="inputBusca" placeholder="Procurar por nome ou categoria..." onkeyup="filtrarEstoque()">
  </div>

  <form id="estoqueForm">
    <input type="text" id="nome" placeholder="Nome do Produto" required />
    <select id="categoria" required>
      <option value="">Categoria</option>
      <option value="Biojoia">Biojoia</option>
      <option value="Roupa">Roupa</option>
      <option value="Verdura">Verdura</option>
      <option value="Moda Circular">Moda Circular</option>
    </select>
    <input type="number" id="quantidade" placeholder="Qtd" required min="0" />
    <input type="number" id="preco" placeholder="Preço (R$)" step="0.01" required />
    <input type="file" id="foto" accept="image/*" />
    <button type="submit" id="btnSubmit">CADASTRAR</button>
    <button type="button" id="btnCancelar" onclick="cancelarEdicao()">CANCELAR</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Foto</th>
        <th>Produto</th>
        <th>Estado</th>
        <th>Qtd</th>
        <th>Preço</th>
        <th>Total</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabelaEstoque"></tbody>
  </table>

  <div class="total-container" id="valorTotal">Total Geral: R$ 0,00</div>

  <div class="relatorios">
    <button class="btn-rel btn-pdf" onclick="gerarPDF()">📄 Exportar PDF</button>
    <button class="btn-rel btn-excel" onclick="gerarExcel()">📊 Exportar Excel</button>
    <button class="btn-rel btn-txt" onclick="gerarTXT()">📝 Exportar Texto</button>
  </div>
</div>

<script>
  const form = document.getElementById('estoqueForm');
  const btnSubmit = document.getElementById('btnSubmit');
  const btnCancelar = document.getElementById('btnCancelar');
  const tabela = document.getElementById('tabelaEstoque');
  const valorTotal = document.getElementById('valorTotal');
  const inputBusca = document.getElementById('inputBusca');

  let estoque = JSON.parse(localStorage.getItem('estoque')) || [];
  let indexEmEdicao = -1;

  function salvarNoStorage() {
    localStorage.setItem('estoque', JSON.stringify(estoque));
  }

  function renderizar(lista = estoque) {
    tabela.innerHTML = '';
    let totalAcumulado = 0;

    lista.forEach((item) => {
      const realIndex = estoque.indexOf(item);
      const subtotal = item.quantidade * item.preco;
      totalAcumulado += subtotal;

      let statusHtml = '';
      let linhaClasse = '';
      let alertaTexto = '';

      if (item.quantidade <= 0) {
        statusHtml = '<span class="status-badge status-esgotado">Indisponível</span>';
      } else {
        statusHtml = '<span class="status-badge status-ok">Disponível</span>';
        if (item.quantidade <= 5) {
          linhaClasse = 'stock-baixo';
          alertaTexto = '<span class="alerta-texto">⚠️ QUASE ESGOTADO</span>';
        }
      }
      
      const tr = document.createElement('tr');
      tr.className = linhaClasse;
      tr.innerHTML = `
        <td><img src="${item.foto || 'https://via.placeholder.com/50'}" class="img-produto"></td>
        <td><strong>${item.nome}</strong><br><small>${item.categoria}</small></td>
        <td>${statusHtml}</td>
        <td>${item.quantidade} ${alertaTexto}</td>
        <td>R$ ${item.preco.toFixed(2)}</td>
        <td>R$ ${subtotal.toFixed(2)}</td>
        <td>
          <button class="btn-edit" onclick="prepararEdicao(${realIndex})">✏️</button>
          <button class="btn-remove" onclick="remover(${realIndex})">🗑️</button>
        </td>
      `;
      tabela.appendChild(tr);
    });
    valorTotal.textContent = `Total Geral: R$ ${totalAcumulado.toFixed(2)}`;
  }

  // --- Funções de Edição e Cadastro ---
  function prepararEdicao(index) {
    indexEmEdicao = index;
    const item = estoque[index];
    document.getElementById('nome').value = item.nome;
    document.getElementById('categoria').value = item.categoria;
    document.getElementById('quantidade').value = item.quantidade;
    document.getElementById('preco').value = item.preco;

    form.classList.add('editando');
    btnSubmit.textContent = "SALVAR ALTERAÇÕES";
    btnCancelar.style.display = "block";
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelarEdicao() {
    indexEmEdicao = -1;
    form.reset();
    form.classList.remove('editando');
    btnSubmit.textContent = "CADASTRAR";
    btnCancelar.style.display = "none";
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const fotoArquivo = document.getElementById('foto').files[0];

    if (fotoArquivo) {
      const leitor = new FileReader();
      leitor.onload = (evento) => processarFormulario(evento.target.result);
      leitor.readAsDataURL(fotoArquivo);
    } else {
      const fotoExistente = indexEmEdicao !== -1 ? estoque[indexEmEdicao].foto : null;
      processarFormulario(fotoExistente);
    }
  });

  function processarFormulario(fotoBase64) {
    const itemDados = {
      nome: document.getElementById('nome').value,
      categoria: document.getElementById('categoria').value,
      quantidade: Number(document.getElementById('quantidade').value),
      preco: Number(document.getElementById('preco').value),
      foto: fotoBase64
    };

    if (indexEmEdicao === -1) {
      estoque.push(itemDados);
    } else {
      estoque[indexEmEdicao] = itemDados;
    }

    salvarNoStorage();
    renderizar();
    cancelarEdicao();
  }

  function filtrarEstoque() {
    const termo = inputBusca.value.toLowerCase();
    const filtrados = estoque.filter(i => 
      i.nome.toLowerCase().includes(termo) || 
      i.categoria.toLowerCase().includes(termo)
    );
    renderizar(filtrados);
  }

  function remover(index) {
    if(confirm("Deseja eliminar este item do estoque?")) {
      estoque.splice(index, 1);
      salvarNoStorage();
      renderizar();
    }
  }

  // --- Funções de Exportação ---

  function gerarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(16);
    doc.setTextColor(231, 53, 127);
    doc.text("RELATÓRIO DE ESTOQUE", 10, 15);
    doc.setFontSize(10);
    doc.setTextColor(0, 0, 0);
    
    let y = 30;
    estoque.forEach((item, i) => {
      const aviso = item.quantidade <= 5 ? " (ESTOQUE BAIXO)" : "";
      doc.text(`${i+1}. ${item.nome} | Qtd: ${item.quantidade}${aviso} | Preço: R$ ${item.preco.toFixed(2)}`, 10, y);
      y += 8;
      if (y > 280) { doc.addPage(); y = 20; }
    });
    doc.save('relatorio-estoque.pdf');
  }

  function gerarExcel() {
    if (estoque.length === 0) return alert("Não há dados para exportar.");
    
    // Organiza os dados para o Excel
    const dadosExcel = estoque.map(item => ({
      Produto: item.nome,
      Categoria: item.categoria,
      Quantidade: item.quantidade,
      "Preço Unitário (R$)": item.preco.toFixed(2),
      "Total (R$)": (item.preco * item.quantidade).toFixed(2)
    }));

    const worksheet = XLSX.utils.json_to_sheet(dadosExcel);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Estoque");
    XLSX.writeFile(workbook, "estoque_produtos.xlsx");
  }

  function gerarTXT() {
    if (estoque.length === 0) return alert("Não há dados para exportar.");

    let conteudo = "RELATÓRIO DE ESTOQUE\n";
    conteudo += "==============================\n\n";

    estoque.forEach(item => {
      conteudo += `Produto: ${item.nome}\n`;
      conteudo += `Categoria: ${item.categoria}\n`;
      conteudo += `Quantidade: ${item.quantidade}\n`;
      conteudo += `Preço: R$ ${item.preco.toFixed(2)}\n`;
      conteudo += `------------------------------\n`;
    });

    const blob = new Blob([conteudo], { type: 'text/plain' });
    const link = document.createElement('a');
    link.href = window.URL.createObjectURL(blob);
    link.download = 'estoque.txt';
    link.click();
  }

  renderizar();
</script>
</body>
</html>
