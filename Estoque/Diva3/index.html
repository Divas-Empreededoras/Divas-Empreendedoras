<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Controle de Estoque com Histórico</title>
  <style>
    :root {
      --primary: #E7357F;
      --secondary: #EED316;
      --bg-light: #F2E8E8;
      --text-dark: #333;
      --success: #28a745;
      --danger: #dc3545;
      --info: #17a2b8;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { 
      background-color: var(--bg-light); 
      margin: 0; 
      padding: 20px; 
      color: var(--text-dark);
    }

    h1, h2 { text-align: center; color: var(--primary); }

    .container { 
      max-width: 1200px; 
      margin: auto; 
      background: #fff; 
      padding: 25px; 
      border-radius: 12px; 
      box-shadow: 0 8px 20px rgba(231, 53, 127, 0.1); 
      border-top: 5px solid var(--secondary);
    }

    .dashboard-vendas {
      background: #333;
      color: #fff;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .valor-total { font-size: 24px; color: var(--secondary); font-weight: bold; }

    form { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
      gap: 12px; 
      margin-bottom: 30px;
      background: #fdfdfd;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #eee;
    }

    input, select, button { 
      padding: 12px; 
      font-size: 14px; 
      border: 1px solid #ddd; 
      border-radius: 6px; 
      outline-color: var(--primary);
    }

    button { cursor: pointer; transition: filter 0.3s; border: none; font-weight: bold; }
    button:hover { filter: brightness(0.9); }

    .btn-add { background: var(--primary); color: #fff; }
    .btn-update { background: var(--info); color: #fff; display: none; }

    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
    th { background-color: var(--primary); color: white; }

    .img-preview { 
      width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid var(--secondary);
    }

    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; color: white; }
    .bg-disponivel { background: var(--success); }
    .bg-esgotado { background: var(--danger); }

    .actions { display: flex; gap: 5px; justify-content: center; }
    .btn-sell { background: #ffc107; color: #000; padding: 5px; }
    .btn-edit { background: #007bff; color: white; padding: 5px; }
    .btn-remove { background: #444; color: white; padding: 5px; }
    .btn-history { background: #6c757d; color: white; padding: 5px; }

    /* ESTILOS DO MODAL DE HISTÓRICO */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 20px;
      width: 80%;
      max-width: 600px;
      border-radius: 12px;
      max-height: 70vh;
      overflow-y: auto;
    }
    .close-modal { float: right; font-size: 28px; cursor: pointer; }
    .historico-lista { list-style: none; padding: 0; }
    .historico-item { 
      padding: 10px; 
      border-bottom: 1px solid #eee; 
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }
    .hist-data { color: #888; font-size: 12px; }

    .relatorios { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
    .btn-csv { background: var(--secondary); color: #000; padding: 10px 20px; }
    .btn-print { background: #fff; color: var(--primary); border: 2px solid var(--primary); padding: 10px 20px; }

    @media print {
      .relatorios, form, .actions, th:last-child, td:last-child, .dashboard-vendas, .modal { display: none; }
      .container { box-shadow: none; border: none; width: 100%; }
    }
  </style>
</head>
<body>

<h1>📦 Sistema de Controle de Estoque</h1>

<div class="container">
  <div class="dashboard-vendas">
    <span>💰 Total Acumulado em Vendas:</span>
    <span class="valor-total" id="totalVendasDisplay">R$ 0.00</span>
    <button onclick="resetarVendas()" style="background: #555; font-size: 10px; padding: 5px;">Zerar Vendas</button>
  </div>

  <h2 id="formTitle">Cadastrar Novo Produto</h2>
  <form id="estoqueForm">
    <input type="hidden" id="editIndex" value="-1">
    <input type="text" id="nome" placeholder="Nome do produto" required />
    <select id="categoria" required>
      <option value="">Categoria</option>
      <option value="Biojoia">Biojoia</option>
      <option value="Roupa">Roupa</option>
      <option value="Verdura">Verdura</option>
      <option value="Moda Circular">Moda Circular</option>
    </select>
    <select id="tipo" required>
      <option value="">Tipo</option>
      <option value="Artesanal">Artesanal</option>
      <option value="Industrializado">Industrializado</option>
      <option value="Orgânico">Orgânico</option>
      <option value="Reutilizado">Reutilizado</option>
    </select>
    <input type="number" id="quantidade" placeholder="Qtd" required min="0" />
    <input type="number" id="preco" placeholder="Preço (R$)" step="0.01" required min="0" />
    <input type="file" id="foto" accept="image/*" />
    <button type="submit" id="btnAdd" class="btn-add">Adicionar</button>
    <button type="button" id="btnUpdate" class="btn-update" onclick="salvarEdicao()">Atualizar</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Foto</th>
        <th>Produto</th>
        <th>Categoria</th>
        <th>Qtd</th>
        <th>Status</th>
        <th>Preço Unit.</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabelaEstoque"></tbody>
  </table>

  <div class="relatorios">
    <button class="btn-csv" onclick="gerarCSV()">📄 Exportar CSV</button>
    <button class="btn-print" onclick="window.print()">🧾 Imprimir / PDF</button>
  </div>
</div>

<div id="modalHistorico" class="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="fecharModal()">&times;</span>
    <h2 id="modalNomeProduto" style="margin-top:0">Histórico do Produto</h2>
    <ul id="listaHistorico" class="historico-lista"></ul>
  </div>
</div>

<script>
  const form = document.getElementById('estoqueForm');
  const tabela = document.getElementById('tabelaEstoque');
  const btnAdd = document.getElementById('btnAdd');
  const btnUpdate = document.getElementById('btnUpdate');
  const formTitle = document.getElementById('formTitle');
  const displayVendas = document.getElementById('totalVendasDisplay');

  let estoque = JSON.parse(localStorage.getItem('estoque')) || [];
  let totalVendas = Number(localStorage.getItem('totalVendas')) || 0;

  function obterDataHora() {
    const agora = new Date();
    return agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
  }

  function adicionarEventoHistorico(index, acao) {
    if (!estoque[index].historico) estoque[index].historico = [];
    estoque[index].historico.push({
      data: obterDataHora(),
      acao: acao
    });
  }

  function salvar() {
    try {
      localStorage.setItem('estoque', JSON.stringify(estoque));
      localStorage.setItem('totalVendas', totalVendas);
    } catch (e) {
      alert("Memória cheia! Tente remover itens ou usar fotos menores.");
    }
  }

  function renderizar() {
    tabela.innerHTML = '';
    displayVendas.innerText = `R$ ${totalVendas.toFixed(2)}`;

    estoque.forEach((item, index) => {
      const statusClass = item.quantidade > 0 ? 'bg-disponivel' : 'bg-esgotado';
      const statusText = item.quantidade > 0 ? 'Disponível' : 'Esgotado';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.foto ? `<img src="${item.foto}" class="img-preview">` : '—'}</td>
        <td><strong>${item.nome}</strong><br><small>${item.tipo}</small></td>
        <td>${item.categoria}</td>
        <td>${item.quantidade}</td>
        <td><span class="badge ${statusClass}">${statusText}</span></td>
        <td>R$ ${Number(item.preco).toFixed(2)}</td>
        <td class="actions">
          <button class="btn-sell" onclick="vender(${index})" title="Vender 1 unidade">💰 Vender</button>
          <button class="btn-history" onclick="abrirHistorico(${index})" title="Ver Histórico">🕒</button>
          <button class="btn-edit" onclick="prepararEdicao(${index})" title="Editar">✏️</button>
          <button class="btn-remove" onclick="remover(${index})" title="Excluir">🗑️</button>
        </td>
      `;
      tabela.appendChild(tr);
    });
  }

  function vender(index) {
    if (estoque[index].quantidade > 0) {
      totalVendas += Number(estoque[index].preco);
      estoque[index].quantidade -= 1;
      
      adicionarEventoHistorico(index, `Venda realizada (-1 unid.). Restante: ${estoque[index].quantidade}`);
      
      salvando_e_renderizando();
    } else {
      alert("Produto esgotado!");
    }
  }

  function abrirHistorico(index) {
    const item = estoque[index];
    const modal = document.getElementById('modalHistorico');
    const lista = document.getElementById('listaHistorico');
    document.getElementById('modalNomeProduto').innerText = `Histórico: ${item.nome}`;
    
    lista.innerHTML = '';
    if (item.historico && item.historico.length > 0) {
      // Inverte para mostrar o mais recente primeiro
      [...item.historico].reverse().forEach(h => {
        lista.innerHTML += `
          <li class="historico-item">
            <span>${h.acao}</span>
            <span class="hist-data">${h.data}</span>
          </li>`;
      });
    } else {
      lista.innerHTML = '<li>Nenhum histórico registrado.</li>';
    }
    
    modal.style.display = "block";
  }

  function fecharModal() {
    document.getElementById('modalHistorico').style.display = "none";
  }

  // Fecha o modal se clicar fora dele
  window.onclick = function(event) {
    const modal = document.getElementById('modalHistorico');
    if (event.target == modal) modal.style.display = "none";
  }

  function resetarVendas() {
    if(confirm("Deseja zerar o histórico de vendas total?")) {
        totalVendas = 0;
        salvando_e_renderizando();
    }
  }

  function remover(index) {
    if(confirm("Deseja realmente excluir este item?")) {
        estoque.splice(index, 1);
        salvando_e_renderizando();
    }
  }

  function prepararEdicao(index) {
    const item = estoque[index];
    document.getElementById('nome').value = item.nome;
    document.getElementById('categoria').value = item.categoria;
    document.getElementById('tipo').value = item.tipo;
    document.getElementById('quantidade').value = item.quantidade;
    document.getElementById('preco').value = item.preco;
    document.getElementById('editIndex').value = index;

    formTitle.innerText = "Editando Produto";
    btnAdd.style.display = 'none';
    btnUpdate.style.display = 'inline-block';
    window.scrollTo(0, 0);
  }

  function salvarEdicao() {
    const index = document.getElementById('editIndex').value;
    const fotoArquivo = document.getElementById('foto').files[0];

    const atualizar = (fotoBase64 = null) => {
      estoque[index] = {
        ...estoque[index],
        nome: document.getElementById('nome').value,
        categoria: document.getElementById('categoria').value,
        tipo: document.getElementById('tipo').value,
        quantidade: Number(document.getElementById('quantidade').value),
        preco: Number(document.getElementById('preco').value),
      };
      
      if (fotoBase64) estoque[index].foto = fotoBase64;
      
      adicionarEventoHistorico(index, "Dados do produto editados.");
      resetarFormulario();
      salvando_e_renderizando();
    };

    if (fotoArquivo) {
      const reader = new FileReader();
      reader.onloadend = () => atualizar(reader.result);
      reader.readAsDataURL(fotoArquivo);
    } else {
      atualizar();
    }
  }

  function resetarFormulario() {
    form.reset();
    document.getElementById('editIndex').value = "-1";
    formTitle.innerText = "Cadastrar Novo Produto";
    btnAdd.style.display = 'inline-block';
    btnUpdate.style.display = 'none';
  }

  function salvando_e_renderizando() {
    salvar();
    renderizar();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (document.getElementById('editIndex').value !== "-1") return;

    const fotoArquivo = document.getElementById('foto').files[0];
    
    const adicionarItem = (fotoBase64 = null) => {
        const novoItem = {
            nome: document.getElementById('nome').value,
            categoria: document.getElementById('categoria').value,
            tipo: document.getElementById('tipo').value,
            quantidade: Number(document.getElementById('quantidade').value),
            preco: Number(document.getElementById('preco').value),
            foto: fotoBase64,
            historico: [] // Inicializa histórico
        };
        
        estoque.push(novoItem);
        const novoIndex = estoque.length - 1;
        adicionarEventoHistorico(novoIndex, `Produto cadastrado com estoque inicial de ${novoItem.quantidade}.`);
        
        salvando_e_renderizando();
        form.reset();
    };

    if (fotoArquivo) {
        const reader = new FileReader();
        reader.onloadend = () => adicionarItem(reader.result);
        reader.readAsDataURL(fotoArquivo);
    } else {
        adicionarItem();
    }
  });

  function gerarCSV() {
    if (estoque.length === 0) return alert('Estoque vazio');
    let csv = 'Produto,Categoria,Tipo,Quantidade,Preco,Status\n';
    estoque.forEach(item => {
      const status = item.quantidade > 0 ? 'Disponivel' : 'Esgotado';
      csv += `${item.nome},${item.categoria},${item.tipo},${item.quantidade},${item.preco.toFixed(2)},${status}\n`;
    });
    csv += `\nTOTAL ACUMULADO EM VENDAS,,,R$ ${totalVendas.toFixed(2)}`;

    const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'relatorio_estoque.csv';
    link.click();
  }
  
  renderizar();
</script>

</body>
</html>
