<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login | ERP Divas Empreendedoras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #b5179e, #7209b7);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-title {
      font-weight: 600;
      color: #7209b7;
    }

    .form-label {
      font-weight: 500;
      color: #560bad;
    }

    .form-control {
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #ddd;
    }

    .form-control:focus {
      border-color: #b5179e;
      box-shadow: 0 0 0 0.15rem rgba(181, 23, 158, 0.25);
    }

    .btn-divas {
      background: linear-gradient(90deg, #b5179e, #7209b7);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-divas:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }

    .btn-google {
      border-radius: 12px;
      padding: 12px;
      font-weight: 500;
      border: 1px solid #ddd;
      transition: all 0.3s ease;
    }

    .btn-google:hover {
      background-color: #f6f0fa;
      border-color: #7209b7;
      color: #560bad;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #999;
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e0e0e0;
    }

    .divider:not(:empty)::before {
      margin-right: .75em;
    }

    .divider:not(:empty)::after {
      margin-left: .75em;
    }

    @media (max-width: 576px) {
      .login-card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="text-center mb-4">
      <h3 class="login-title">Divas Empreendedoras</h3>
      <p class="text-muted">Acesso ao ERP</p>
    </div>

    <!-- FORM LOGIN -->
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-divas w-100 mb-3">
        Entrar
      </button>
    </form>

    <div class="divider">ou</div>

    <!-- GOOGLE LOGIN -->
    <button id="googleLogin" class="btn btn-light btn-google w-100">
      <i class="bi bi-google me-2"></i> Entrar com Google
    </button>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      GoogleAuthProvider, 
      signInWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
  apiKey: "AIzaSyCvHIU1nYdp0YFdEK5Vhx4owQywuslDFlY",
  authDomain: "divas-empreendedoras-erp.firebaseapp.com",
  projectId: "divas-empreendedoras-erp",
  storageBucket: "divas-empreendedoras-erp.firebasestorage.app",
  messagingSenderId: "424568680710",
  appId: "1:424568680710:web:d5c61ddbf9830d9330ae87"
  };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          window.location.href = "./src/pages/home.html";
        })
        .catch((error) => {
          alert("Email ou senha incorretos");
          console.error(error.code, error.message);
        });
    });

    document.getElementById("googleLogin").addEventListener("click", () => {
      signInWithPopup(auth, provider)
        .then(() => {
          window.location.href = "./src/pages/home.html";
        })
        .catch((error) => {
          alert("Erro ao autenticar com Google");
          console.error(error.code, error.message);
        });
    });
  </script>

</body>
</html>
