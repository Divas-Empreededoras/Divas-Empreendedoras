<!-- MODAL -->
<div class="modal fade" id="produtoModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl modal-dialog-scrollable">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalTitulo">Produto</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="produtoId">

        <div class="row g-3">

          <!-- IMAGEM -->
          <div class="col-md-3 text-center">
            <img id="previewImagem" src="https://via.placeholder.com/150"
              class="img-fluid rounded mb-2">
            <input type="url" class="form-control" id="imagem"
              placeholder="URL da imagem">
          </div>

          <!-- DADOS PRINCIPAIS -->
          <div class="col-md-9">
            <div class="row g-3">

              <div class="col-md-6">
                <label>Descrição *</label>
                <input class="form-control" id="descricao">
              </div>

              <div class="col-md-3">
                <label>Marca</label>
                <input class="form-control" id="marca">
              </div>

              <div class="col-md-3">
                <label>Setor</label>
                <input class="form-control" id="setor">
              </div>

              <div class="col-md-3">
                <label>Grupo</label>
                <input class="form-control" id="grupo">
              </div>

              <div class="col-md-3">
                <label>Sub Grupo</label>
                <input class="form-control" id="subgrupo">
              </div>

              <div class="col-md-3">
                <label>Código Produto</label>
                <input class="form-control" id="codigoProduto">
              </div>

              <div class="col-md-3">
                <label>Código de Barras</label>
                <input class="form-control" id="codigoBarras">
              </div>

              <div class="col-md-3">
                <label>Preço de Custo</label>
                <input class="form-control" type="number" id="custo">
              </div>

              <div class="col-md-3">
                <label>Preço de Venda</label>
                <input class="form-control" type="number" id="venda">
              </div>

              <div class="col-md-3">
                <label>Markup (%)</label>
                <input class="form-control" id="markup" disabled>
              </div>

            </div>
          </div>

        </div>
      </div>

      <div class="modal-footer">
        <button id="btnSalvar" onclick="salvarProduto()" class="btn btn-primary">
            Salvar
        </button>

      </div>

    </div>
  </div>

<!-- FIREBASE -->
<script type="module">
/* =======================
   FIREBASE CONFIG
======================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  updateDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvHIU1nYdp0YFdEK5Vhx4owQywuslDFlY",
  authDomain: "divas-empreendedoras-erp.firebaseapp.com",
  projectId: "divas-empreendedoras-erp",
  storageBucket: "divas-empreendedoras-erp.firebasestorage.app",
  messagingSenderId: "424568680710",
  appId: "1:424568680710:web:d5c61ddbf9830d9330ae87"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* =======================
   ELEMENTOS
======================= */
const tabela = document.getElementById("tabelaProdutos");
const modalEl = document.getElementById("produtoModal");
const modal = new bootstrap.Modal(modalEl);

const produtoId = document.getElementById("produtoId");
const imagem = document.getElementById("imagem");
const previewImagem = document.getElementById("previewImagem");
const descricao = document.getElementById("descricao");
const marca = document.getElementById("marca");
const grupo = document.getElementById("grupo");
const subgrupo = document.getElementById("subgrupo");
const setor = document.getElementById("setor");
const codigoProduto = document.getElementById("codigoProduto");
const codigoBarras = document.getElementById("codigoBarras");
const custo = document.getElementById("custo");
const venda = document.getElementById("venda");
const markup = document.getElementById("markup");
const modalTitulo = document.getElementById("modalTitulo");
const btnSalvar = document.getElementById("btnSalvar");

/* =======================
   FUNÇÕES AUXILIARES
======================= */

// Limpa formulário
function limparCampos() {
  produtoId.value = "";
  imagem.value = "";
  previewImagem.src = "https://via.placeholder.com/150";
  descricao.value = "";
  marca.value = "";
  grupo.value = "";
  subgrupo.value = "";
  setor.value = "";
  codigoProduto.value = "";
  codigoBarras.value = "";
  custo.value = "";
  venda.value = "";
  markup.value = "";
}

// Habilita / desabilita campos
function setCampos(ativo) {
  [
    imagem, descricao, marca, grupo, subgrupo,
    setor, codigoProduto, codigoBarras,
    custo, venda
  ].forEach(c => c.disabled = !ativo);

  btnSalvar.style.display = ativo ? "inline-block" : "none";
}

// Calcula markup automaticamente
function calcularMarkup() {
  const c = Number(custo.value);
  const v = Number(venda.value);

  if (c > 0 && v > 0) {
    markup.value = (((v - c) / c) * 100).toFixed(2) + "%";
  } else {
    markup.value = "";
  }
}

custo.addEventListener("input", calcularMarkup);
venda.addEventListener("input", calcularMarkup);

// Atualiza preview da imagem
imagem.addEventListener("input", () => {
  previewImagem.src = imagem.value || "https://via.placeholder.com/150";
});

// Retorna IDs selecionados
function getSelecionados() {
  return [...document.querySelectorAll(".chk:checked")].map(c => c.value);
}

/* =======================
   CRUD
======================= */

// Carregar produtos
async function carregarProdutos() {
  tabela.innerHTML = "";
  const snap = await getDocs(collection(db, "produtos"));

  snap.forEach(docSnap => {
    const p = docSnap.data();

    tabela.innerHTML += `
      <tr>
        <td><input type="checkbox" class="chk" value="${docSnap.id}"></td>
        <td>
          <img src="${p.imagem || 'https://via.placeholder.com/50'}"
               width="50" class="rounded">
        </td>
        <td>${p.descricao}</td>
        <td>${p.marca || ""}</td>
        <td>${p.grupo || ""}</td>
        <td>${p.subgrupo || ""}</td>
        <td>${p.setor || ""}</td>
        <td>R$ ${p.custo?.toFixed(2) || "0.00"}</td>
        <td>R$ ${p.venda?.toFixed(2) || "0.00"}</td>
        <td>${p.markup || ""}</td>
      </tr>
    `;
  });
}

// Criar
window.abrirModal = () => {
  modalTitulo.textContent = "Cadastrar Produto";
  limparCampos();
  setCampos(true);
  modal.show();
};

// Salvar
window.salvarProduto = async () => {
  if (!descricao.value.trim()) {
    alert("A descrição do produto é obrigatória.");
    return;
  }

  if (!custo.value || !venda.value) {
    alert("Atenção: preço de custo ou venda não informado.");
  }

  const dados = {
    imagem: imagem.value,
    descricao: descricao.value,
    marca: marca.value,
    grupo: grupo.value,
    subgrupo: subgrupo.value,
    setor: setor.value,
    codigoProduto: codigoProduto.value,
    codigoBarras: codigoBarras.value,
    custo: Number(custo.value) || 0,
    venda: Number(venda.value) || 0,
    markup: markup.value
  };

  if (produtoId.value) {
    await updateDoc(doc(db, "produtos", produtoId.value), dados);
  } else {
    await addDoc(collection(db, "produtos"), dados);
  }

  modal.hide();
  carregarProdutos();
};

// Visualizar
window.visualizarProduto = async () => {
  const ids = getSelecionados();
  if (ids.length !== 1) {
    alert("Selecione apenas um produto para visualizar.");
    return;
  }

  const snap = await getDoc(doc(db, "produtos", ids[0]));
  const p = snap.data();

  modalTitulo.textContent = "Visualizar Produto";
  produtoId.value = ids[0];

  imagem.value = p.imagem || "";
  previewImagem.src = p.imagem || "https://via.placeholder.com/150";
  descricao.value = p.descricao;
  marca.value = p.marca || "";
  grupo.value = p.grupo || "";
  subgrupo.value = p.subgrupo || "";
  setor.value = p.setor || "";
  codigoProduto.value = p.codigoProduto || "";
  codigoBarras.value = p.codigoBarras || "";
  custo.value = p.custo || "";
  venda.value = p.venda || "";
  markup.value = p.markup || "";

  setCampos(false);
  modal.show();
};

// Editar
window.editarSelecionado = async () => {
  const ids = getSelecionados();
  if (ids.length !== 1) {
    alert("Selecione apenas um produto para editar.");
    return;
  }

  const snap = await getDoc(doc(db, "produtos", ids[0]));
  const p = snap.data();

  modalTitulo.textContent = "Editar Produto";
  produtoId.value = ids[0];

  imagem.value = p.imagem || "";
  previewImagem.src = p.imagem || "https://via.placeholder.com/150";
  descricao.value = p.descricao;
  marca.value = p.marca || "";
  grupo.value = p.grupo || "";
  subgrupo.value = p.subgrupo || "";
  setor.value = p.setor || "";
  codigoProduto.value = p.codigoProduto || "";
  codigoBarras.value = p.codigoBarras || "";
  custo.value = p.custo || "";
  venda.value = p.venda || "";
  markup.value = p.markup || "";

  setCampos(true);
  modal.show();
};

// Excluir
window.excluirSelecionados = async () => {
  const ids = getSelecionados();
  if (!ids.length) {
    alert("Selecione pelo menos um produto.");
    return;
  }

  if (!confirm("Deseja excluir os produtos selecionados?")) return;

  for (const id of ids) {
    await deleteDoc(doc(db, "produtos", id));
  }

  carregarProdutos();
};

/* =======================
   CHECK ALL
======================= */
document.getElementById("checkAll")?.addEventListener("change", e => {
  document.querySelectorAll(".chk").forEach(c => c.checked = e.target.checked);
});

/* =======================
   INIT
======================= */
carregarProdutos();
</script>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
